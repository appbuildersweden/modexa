[package]
name = "modexa"
version = "0.2.0"
description = "Modexa – desktop AI agent workspace"
authors = ["Modexa"]
license = ""
repository = "https://github.com/appbuildersweden/modexa"
edition = "2024"
rust-version = "1.90"

[lib]
name = "modexa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
